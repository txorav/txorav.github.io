name: Manual CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: Check and build Go site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Go formatting
        run: |
          gofmt -w cmd internal
          git --no-pager diff --exit-code -- cmd internal

      - name: Analyze Go code
        run: go vet ./...

      - name: Compile application
        run: |
          mkdir -p bin
          go build -trimpath -o bin/portfolio ./cmd/portfolio

      - name: Generate static pages, RSS, and sitemap
        run: ./bin/portfolio build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
